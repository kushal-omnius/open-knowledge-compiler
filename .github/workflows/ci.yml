name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kc
          POSTGRES_PASSWORD: kc
          POSTGRES_DB: kc_wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      KC_DATABASE_URL: postgresql+psycopg://kc:kc@localhost:5432/kc_wiki

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[all]

      - name: Apply database migrations
        run: python -c "from knowledge_compiler.compiler.bootstrap import upgrade_schema; upgrade_schema()"

      - name: Run test suite
        run: pytest
