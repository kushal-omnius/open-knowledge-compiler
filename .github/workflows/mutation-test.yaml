name: Mutation Testing (manual)

# Exploratory / spike tooling, not a merge gate: mutation testing is slow
# relative to a normal test run, so this stays workflow_dispatch-only until
# a mutation-score threshold and cadence are actually decided (see
# BRAINSTORM-test-generation-eval.md, which this workflow exists to
# validate for the milestone-3 test-generation eval methodology). Runs on
# ubuntu-latest specifically because mutmut 3.x has no native Windows
# support (mutmut#397) — this sidesteps needing WSL on a local dev machine.

on:
  workflow_dispatch:
    inputs:
      paths_to_mutate:
        description: 'File or directory to mutate (relative to repo root)'
        required: true
        default: 'knowledge_compiler/compiler/normalize.py'
        type: string
      test_path:
        description: 'Test file/dir to run as the kill check (relative to repo root)'
        required: true
        default: 'tests/test_normalize.py'
        type: string

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .[dev] mutmut

      # mutmut 3.x dropped --paths-to-mutate/--runner/--CI entirely; the only
      # way to configure a run is [tool.mutmut] in pyproject.toml (source_paths,
      # pytest_add_cli_args_test_selection) -- confirmed by reading mutmut's
      # own configuration.py/__main__.py source, since the CLI --help and the
      # published docs disagree with each other across 2.x/3.x. Appended here
      # rather than committed since the target is workflow_dispatch-configurable.
      - name: Configure mutmut
        run: |
          cat >> pyproject.toml <<EOF

          [tool.mutmut]
          source_paths = ["${{ inputs.paths_to_mutate }}"]
          pytest_add_cli_args_test_selection = ["${{ inputs.test_path }}"]
          EOF

      - name: Run mutmut
        run: mutmut run || true

      - name: Print results summary
        run: mutmut results | tee mutmut-results.txt

      - name: Export CI/CD stats (killed/survived/total counts)
        run: mutmut export-cicd-stats || true

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: |
            mutmut-results.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
