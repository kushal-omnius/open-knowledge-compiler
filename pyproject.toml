[project]
name = "knowledge-compiler"
version = "0.1.0"
description = "Compiles software engineering artifacts into a structured, queryable knowledge base"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.2.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "pgvector>=0.2",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
llm = [
    "anthropic>=0.40",
]
llm-openai = [
    "openai>=1.40",
]
serve = [
    "mcp>=1.0,<2.0",
]
all = [
    "knowledge-compiler[dev,llm,llm-openai,serve]",
]

[project.scripts]
kc = "knowledge_compiler.cli:main"

# Built-in plugins register through the same entry-point groups third parties use (ADR-007).
# Groups are declared in knowledge_compiler.interfaces; entries land with each built-in.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
